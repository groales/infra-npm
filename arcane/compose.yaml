services:
  arcane:
    image: ghcr.io/getarcaneapp/arcane:latest
    container_name: arcane
    restart: unless-stopped
    ports:
      - 3552:3552
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - ${PROJECTS_DIRECTORY}:${PROJECTS_DIRECTORY}
    environment:
      - TZ=${TZ}
      - APP_URL=${APP_URL}
      - PROJECTS_DIRECTORY=${PROJECTS_DIRECTORY}
      - PUID=${PUID}
      - PGID=${PGID}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}

networks:
  default:
    external: true
    name: proxy
